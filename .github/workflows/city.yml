name: 잔디 도시 GIF

on:
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 바로 실행
  # 매일 자동 촬영은 꺼 둠 (프로필에서 도시를 뺐기 때문). 다시 켜려면 아래 두 줄의 # 를 지우면 된다.
  # schedule:
  #   - cron: '7 16 * * *' # 매일 새벽 1시 7분 (한국 시간)

permissions:
  contents: write

concurrency: city-gif

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 촬영 도구 설치 (브라우저 + ffmpeg)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 잔디 도시 한 바퀴 촬영
        run: |
          mkdir -p dist
          node scripts/capture-city.mjs "https://github-trailer.vercel.app/city/${{ github.repository_owner }}?capture=1" dist/city.gif
          ls -la dist

      - name: output 브랜치에 GIF 올리기 (기록은 하나만 남기고 덮어쓰기)
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city.gif
          git commit -qm "잔디 도시 GIF 갱신"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
